# v* タグの push で Windows 版をビルドし、GitHub Releases に下書きとしてアップロードする。
# 下書きを「公開」すると、インストール済みのアプリが自動更新で取得する。
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # Electron 44 以降は Node 22.12 以上が必要
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # ドライブ連携用の OAuth クライアント（デスクトップアプリ）をアプリに同梱する
      - name: Write OAuth client
        shell: pwsh
        env:
          OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
        run: |
          if (-not $env:OAUTH_CLIENT_JSON) { throw 'Secret GOOGLE_OAUTH_CLIENT_JSON が未設定です。' }
          Set-Content -Path oauth-client.json -Value $env:OAUTH_CLIENT_JSON -NoNewline -Encoding utf8NoBOM

      # 下書きを先に作っておく。electron-builder に作らせると nsis と portable が
      # 同時に作成して下書きが2つに分かれ、ファイルが片方に入らないことがある
      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) { exit 0 }
          gh release create $env:TAG --draft --verify-tag --title $env:TAG.TrimStart('v') --notes ''
          exit $LASTEXITCODE

      - run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
